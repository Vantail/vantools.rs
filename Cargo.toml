[package]
name = "vantools"
version = "0.1.0"
edition = "2024"

[dependencies]
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Allow Clippy suggestions that conflict with the explicit "boring"
# style:
needless_return = "allow"
unnecessary_wraps = "allow"
# Explicit-style lints (restriction group):
implicit_return = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
too_many_lines = "deny"
exhaustive_structs = "deny"
exhaustive_enums = "deny"

[[bin]]
name = "van"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
